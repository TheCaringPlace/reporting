name: Prune Stale SST Stages

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: prune-stale-sst-stages

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.1
        with:
          role-to-assume: arn:aws:iam::677276093280:role/GitHubDeploy
          role-duration-seconds: 3600
          aws-region: us-east-2

      - name: Prune stale SST stages
        run: npx sst-stage-prune@1.0.2 cleanup-pr-stages
        env:
          GH_TOKEN: ${{ github.token }}
